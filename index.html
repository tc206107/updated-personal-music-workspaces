<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TangCheee</title>
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2315100c'/%3E%3Crect x='7' y='7' width='18' height='18' fill='none' stroke='%23c9a25e' stroke-width='2' transform='rotate(45 16 16)'/%3E%3C/svg%3E">
</head>
<body>

  <div class="side-rail side-rail-left" aria-hidden="true"></div>
  <div class="side-rail side-rail-right" aria-hidden="true"></div>

  <header class="masthead">
    <a class="brand" href="#top">
      <span class="brand-mark"><span>TC</span></span>
      <span class="brand-name">TangCheee</span>
    </a>
    <nav class="nav" aria-label="主导航">
      <a href="catalog.html">作品集</a>
      <a href="#about">关于</a>
      <a href="overview.html">总览</a>
    </nav>
  </header>

  <div class="ornament-band" aria-hidden="true"></div>

  <main id="top">
    <section class="hero">
      <div class="title-card">
        <span class="corner corner-tl" aria-hidden="true"></span>
        <span class="corner corner-tr" aria-hidden="true"></span>
        <span class="corner corner-bl" aria-hidden="true"></span>
        <span class="corner corner-br" aria-hidden="true"></span>
        <h1 class="hero-title">TangCheee</h1>
        <p class="hero-intro">
          票友级音乐创作者<br>
          十八流钢琴家<br>
          浴室歌唱家
        </p>
        <div class="hero-divider" aria-hidden="true"></div>
      </div>
    </section>

    <section class="works" id="works">
      <div class="overview-entry">
        <a class="overview-entry-link" href="overview.html">音乐作品总览</a>
        <p class="overview-hint">点击进入 · 查看全部作品</p>
      </div>
      <header class="section-head">
        <h2>作品集</h2>
        <p class="section-note">点击可在线播放，midi文件可以直接下载，若有涉及版权的使用请告知，多谢支持。</p>
      </header>
      <div class="filmstrip-wrap">
        <div class="filmstrip" id="filmstrip" role="list" aria-label="作品列表"></div>
      </div>
    </section>

    <section class="about" id="about">
      <header class="section-head">
        <h2>关于</h2>
      </header>
      <div class="about-card">
        <p class="about-copy">
          你好，欢迎来到我的个人作品集<br>
          这里是每一滴属于我的灵感汇聚的地方，也希望它能成为带给你一点点美好感受的地方<br>
          在此感谢所有喜爱与支持我的人
        </p>
        <ul class="contact-list" id="contactList"></ul>
      </div>
    </section>
  </main>

  <div class="player-bar" id="playerBar" hidden>
    <button class="pb-btn" id="pbToggle" aria-label="播放或暂停" type="button">▶</button>
    <div class="pb-info">
      <span class="pb-title" id="pbTitle">—</span>
      <span class="pb-meta" id="pbMeta"></span>
    </div>
    <div class="pb-seek">
      <input type="range" id="pbSeek" min="0" max="1000" value="0" step="1" aria-label="进度">
    </div>
    <span class="pb-time"><span id="pbCur">00:00</span> / <span id="pbDur">00:00</span></span>
    <a class="pb-download" id="pbDownload" download>MIDI</a>
  </div>

  <div class="footer-orn" aria-hidden="true"></div>

  <script src="assets/js/works.js"></script>
  <script src="assets/js/loader.js"></script>
  <script src="assets/js/player.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script>
    // 处理 Netlify Identity 邮件确认/邀请链接落在首页时的令牌，并自动进入管理页
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", function (user) {
        if (!user) {
          window.netlifyIdentity.on("login", function () {
            document.location.href = "/admin/";
          });
        }
      });
    }
  </script>

</body>
</html>
