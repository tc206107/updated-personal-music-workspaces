<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理 — TangCheee</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #15100c;
      color: #efe4cd;
      font-family: Georgia, "Songti SC", "SimSun", serif;
    }
    #status, #cmsError {
      max-width: 560px;
      text-align: center;
      line-height: 2.2;
      letter-spacing: .08em;
      padding: 2rem;
      border: 1px solid #8a6c3d;
      background: #241c13;
    }
    #cmsError { display: none; }
    #status strong, #cmsError strong { color: #c9a25e; font-weight: 400; letter-spacing: .18em; }
    .mono { font-family: Consolas, Menlo, monospace; font-size: .74rem; word-break: break-all; color: #c9a25e; }
    button {
      margin-top: 1rem;
      padding: .5rem 1.2rem;
      background: transparent;
      color: #c9a25e;
      border: 1px solid #8a6c3d;
      font: inherit;
      letter-spacing: .12em;
      cursor: pointer;
    }
    button:hover { background: #c9a25e; color: #15100c; }
  </style>
</head>
<body>
  <div id="status"><strong>正在加载管理界面</strong><br>请稍候…</div>
  <div id="cmsError">
    <strong>管理界面加载失败</strong><br>
    <span class="mono" id="failReason"></span><br>
    请检查网络后重试；若持续出现，确认已把包含 admin/ 文件夹的完整站点重新部署，<br>
    并在 Netlify 后台开启 Identity 与 Git Gateway。
    <br><button type="button" onclick="location.reload()">刷新重试</button>
  </div>

  <script>
    (function () {
      function inject(src) {
        return new Promise(function (resolve, reject) {
          var s = document.createElement("script");
          s.src = src;
          s.onload = resolve;
          s.onerror = function () { s.remove(); reject(new Error(src)); };
          document.head.appendChild(s);
        });
      }

      function fail(reason) {
        var r = document.getElementById("failReason");
        if (r) r.textContent = reason || "";
        var st = document.getElementById("status");
        if (st) st.style.display = "none";
        var er = document.getElementById("cmsError");
        if (er) er.style.display = "block";
      }

      var cmsUrls = [
        "https://cdn.jsdelivr.net/npm/decap-cms@^3.0.0/dist/decap-cms.js",
        "https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"
      ];

      function loadCms(i) {
        if (i >= cmsUrls.length) {
          fail("Decap CMS 脚本加载失败（jsDelivr 与 unpkg 均不可用）");
          return;
        }
        inject(cmsUrls[i]).then(function () {
          if (window.CMS) {
            var st = document.getElementById("status");
            if (st) st.style.display = "none";
          } else {
            loadCms(i + 1);
          }
        }, function () {
          loadCms(i + 1);
        });
      }

      // 不加载外部 identity widget，使用 Decap CMS 内置的 GoTrue
      // 邮箱/密码登录页，避免弹窗因外部脚本加载问题闪退。
      loadCms(0);
    })();
  </script>
</body>
</html>
