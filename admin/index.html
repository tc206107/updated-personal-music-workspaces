<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理 — TangCheee</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #15100c;
      color: #efe4cd;
      font-family: Georgia, "Songti SC", "SimSun", serif;
    }
    #status, #cmsError {
      max-width: 560px;
      text-align: center;
      line-height: 2.2;
      letter-spacing: .08em;
      padding: 2rem;
      border: 1px solid #8a6c3d;
      background: #241c13;
    }
    #cmsError { display: none; }
    #status strong, #cmsError strong { color: #c9a25e; font-weight: 400; letter-spacing: .18em; }
    .mono { font-family: Consolas, Menlo, monospace; font-size: .76rem; word-break: break-all; color: #c9a25e; }
  </style>
</head>
<body>
  <div id="status"><strong>正在加载管理界面</strong><br>请稍候…</div>
  <div id="cmsError">
    <strong>管理界面加载失败</strong><br>
    请检查网络后刷新重试（Ctrl+F5）。<br>
    <span class="mono" id="failReason"></span><br>
    若持续出现：确认已把包含 admin/ 文件夹的完整站点重新部署，<br>
    并在 Netlify 后台开启 Identity 与 Git Gateway。
  </div>

  <script>
    (function () {
      function inject(src) {
        return new Promise(function (resolve, reject) {
          var s = document.createElement("script");
          s.src = src;
          s.onload = resolve;
          s.onerror = function () { s.remove(); reject(new Error(src)); };
          document.head.appendChild(s);
        });
      }

      function fail(reason) {
        var r = document.getElementById("failReason");
        if (r) r.textContent = reason || "";
        var st = document.getElementById("status");
        if (st) st.style.display = "none";
        var er = document.getElementById("cmsError");
        if (er) er.style.display = "block";
      }

      function registerLoginReload() {
        if (window.netlifyIdentity) {
          window.netlifyIdentity.on("init", function (user) {
            if (!user) {
              window.netlifyIdentity.on("login", function () {
                document.location.href = "/admin/";
              });
            }
          });
        }
      }

      var identityUrls = [
        "https://identity.netlify.com/v1/netlify-identity-widget.js",
        "https://cdn.jsdelivr.net/npm/netlify-identity-widget@1.9.2/build/netlify-identity-widget.js",
        "https://registry.npmmirror.com/netlify-identity-widget/1.9.2/files/build/netlify-identity-widget.js"
      ];

      var cmsUrls = [
        "https://cdn.jsdelivr.net/npm/decap-cms@^3.0.0/dist/decap-cms.js",
        "https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js",
        "https://registry.npmmirror.com/decap-cms/3.15.1/files/dist/decap-cms.js"
      ];

      function tryLoad(urls, check, onAllFailed, onReady) {
        function next(i) {
          if (i >= urls.length) {
            onAllFailed();
            return;
          }
          inject(urls[i]).then(function () {
            if (check()) {
              if (onReady) onReady();
              return;
            }
            next(i + 1);
          }, function () {
            next(i + 1);
          });
        }
        next(0);
      }

      function loadCms() {
        tryLoad(cmsUrls, function () { return !!window.CMS; }, function () {
          fail("Decap CMS 脚本加载失败（三个备用地址均不可用）");
        }, function () {
          var st = document.getElementById("status");
          if (st) st.style.display = "none";
        });
      }

      // Netlify Identity 组件：官方地址优先，依次回退到国内可达镜像；
      // 组件不可用时也继续加载 CMS（Decap 内置 GoTrue 可作兜底）。
      tryLoad(
        identityUrls,
        function () { return !!window.netlifyIdentity; },
        function () {
          registerLoginReload();
          loadCms();
        },
        function () {
          registerLoginReload();
          loadCms();
        }
      );
    })();
  </script>
</body>
</html>
