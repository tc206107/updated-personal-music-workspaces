<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理 — TangCheee</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #15100c;
      color: #efe4cd;
      font-family: Georgia, "Songti SC", "SimSun", serif;
    }
    #cmsError {
      display: none;
      max-width: 520px;
      text-align: center;
      line-height: 2.2;
      letter-spacing: .08em;
      padding: 2rem;
      border: 1px solid #8a6c3d;
      background: #241c13;
    }
    #cmsError strong { color: #c9a25e; font-weight: 400; letter-spacing: .18em; }
  </style>
</head>
<body>
  <div id="cmsError">
    <strong>管理界面加载失败</strong><br>
    请检查网络后刷新重试（Ctrl+F5）。<br>
    若持续出现：确认已把包含 admin/ 文件夹的完整站点重新部署，<br>
    并在 Netlify 后台开启 Identity 与 Git Gateway。
  </div>

  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script>
    (function () {
      var cdn = [
        "https://cdn.jsdelivr.net/npm/decap-cms@^3.0.0/dist/decap-cms.js",
        "https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"
      ];
      function load(src) {
        return new Promise(function (resolve, reject) {
          var s = document.createElement("script");
          s.src = src;
          s.onload = resolve;
          s.onerror = function () { s.remove(); reject(new Error("load failed")); };
          document.head.appendChild(s);
        });
      }
      function tryLoad(i) {
        if (i >= cdn.length) {
          setTimeout(function () {
            if (!window.CMS) document.getElementById("cmsError").style.display = "block";
          }, 400);
          return;
        }
        load(cdn[i]).then(function () {
          if (!window.CMS) tryLoad(i + 1);
        }, function () { tryLoad(i + 1); });
      }
      tryLoad(0);
    })();
  </script>
  <script>
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", function (user) {
        if (!user) {
          window.netlifyIdentity.on("login", function () {
            document.location.href = "/admin/";
          });
        }
      });
    }
  </script>
</body>
</html>
