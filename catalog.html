<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>作品集 — TangCheee</title>
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2315100c'/%3E%3Crect x='7' y='7' width='18' height='18' fill='none' stroke='%23c9a25e' stroke-width='2' transform='rotate(45 16 16)'/%3E%3C/svg%3E">
</head>
<body>

  <div class="side-rail side-rail-left" aria-hidden="true"></div>
  <div class="side-rail side-rail-right" aria-hidden="true"></div>

  <header class="masthead">
    <a class="brand" href="index.html#top">
      <span class="brand-mark"><span>TC</span></span>
      <span class="brand-name">TangCheee</span>
    </a>
    <nav class="nav" aria-label="主导航">
      <a href="catalog.html" aria-current="page">作品集</a>
      <a href="overview.html">总览</a>
      <a href="index.html#about">关于</a>
    </nav>
  </header>

  <div class="ornament-band" aria-hidden="true"></div>

  <main>
    <section class="catalog">
      <div class="title-card catalog-title">
        <span class="corner corner-tl" aria-hidden="true"></span>
        <span class="corner corner-tr" aria-hidden="true"></span>
        <span class="corner corner-bl" aria-hidden="true"></span>
        <span class="corner corner-br" aria-hidden="true"></span>
        <h1 class="catalog-heading">作品集</h1>
      </div>
      <div class="catalog-list" id="catalogList"></div>
    </section>
  </main>

  <div class="player-bar" id="playerBar" hidden>
    <button class="pb-btn" id="pbToggle" aria-label="播放或暂停" type="button">▶</button>
    <div class="pb-info">
      <span class="pb-title" id="pbTitle">—</span>
      <span class="pb-meta" id="pbMeta"></span>
    </div>
    <div class="pb-seek">
      <input type="range" id="pbSeek" min="0" max="1000" value="0" step="1" aria-label="进度">
    </div>
    <span class="pb-time"><span id="pbCur">00:00</span> / <span id="pbDur">00:00</span></span>
    <a class="pb-download" id="pbDownload" download>MIDI</a>
  </div>

  <div class="footer-orn" aria-hidden="true"></div>

  <script src="assets/js/works.js"></script>
  <script src="assets/js/loader.js"></script>
  <script src="assets/js/player.js"></script>
  <script src="assets/js/catalog.js"></script>
</body>
</html>
